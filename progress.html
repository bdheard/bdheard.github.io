<html>
	<head>
		<title>
			Joshua's Progress
		</title>
<style>
body {
	margin: 0;
	padding: 0;

	min-height: 100vh;

	font-family: Tahoma, sans-serif;
	font-size: 16px;
	line-height: 1.5;
	color: #222222;

	background-color: #6688ff;

	display: flex;
	justify-content: center;
	align-items: center;
	flex-direction: column;
}
progress {
	appearance: none;
	width: 80%;
	height: 30px;
}
</style>
	</head>
	<body>
		<p><div id="next-target"></div></p>
		<progress id="jgh-progress"></progress>
		<p><div id="current-progress"></div></p>
<script>

	// points earned, symbol mask
	// tracked | completed | turned in on time | no nagging | due date | short description
	//

	const assignmentListing = [
		[ 0, 1, 1, 0, "2026-09-14", "History",   "Map"                       ],
		[ 0, 1, 1, 0, "2026-09-14", "Tech",      "Drawing"                   ],
		[ 1, 1, 1, 2, "2026-09-15", "History",   "Crash Course"              ],
		[ 1, 1, 1, 2, "2026-09-15", "History",   "Unit 2 Vocab"              ],
		[ 1, 1, 1, 0, "2026-09-15", "History",   "Map"                       ],
		[ 1, 1, 1, 2, "2026-09-15", "Tech",      "Activity 2.13"             ],
		[ 1, 1, 1, 2, "2026-09-16", "Chemistry", "Nuclear Equations"         ],
		[ 1, 1, 1, 2, "2026-09-17", "Band",      "Scale Assessment"          ],
		[ 1, 1, 1, 2, "2026-09-17", "Chemistry", "Half Life Equations"       ],
		[ 1, 1, 1, 0, "2026-09-16", "History",   "Indian Removal Stations"   ],
		[ 1, 1, 1, 2, "2026-09-24", "Chemistry", "Electron Configs"          ],
		[ 1, 1, 1, 2, "2026-09-24", "Band",      "Concert Assessment"        ],
		[ 1, 1, 1, 2, "2026-09-28", "Tech",      "Onshape"                   ],
		[ 1, 1, 1, 0, "2026-09-28", "History",   "Reformers Proj"            ],
		[ 1, 1, 1, 0, "2026-09-28", "Chemistry", "Hog Hilton"                ],
		[ 1, 1, 1, 0, "2026-09-28", "History",   "Slave Narative"            ],
		[ 1, 1, 1, 2, "2026-09-29", "Tech",      "Onshape"                   ],
		[ 1, 1, 1, 2, "2026-09-29", "History",   "Unit 3 Vocab"              ],
		[ 1, 1, 1, 2, "2026-09-30", "History",   "Civil War Strategies"      ],
		[ 1, 1, 1, 2, "2026-10-01", "Tech",      "Onshape"                   ],
		[ 1, 1, 1, 2, "2026-09-30", "History",   "Gettysburg Questions"      ],
		[ 1, 1, 1, 2, "2026-10-01", "Band",      "Scale Assessment"          ],
		[ 1, 1, 1, 2, "2026-10-01", "Chemistry", "Study Guide"               ],
		[ 1, 1, 1, 2, "2026-10-01", "Chemistry", "Packet"                    ],
		[ 1, "", "", 0, "2026-10-02", "History",   "Civil War Causes"          ],
		[ 1, "", "", "", "2026-10-02", "Chemistry", "Gizmo"                     ]
	];

	// reinforcers listing
	// dollar value | points required | reinforcer
	//

	const reinforcers = [
		[  "$10",  30, "Rocket League Season Pass" ],
		[  "$30",  90, "Key Cap Tester"            ],
		[  "$30",  90, "<unknown>"                 ],
		[ "$160", 480, "M.2 SSD"                   ],
		[ "$300", 900, "Gaming Monitor"            ]
	];

	// accumulate across all four earnings slots per assignment
	let progressVal = 0;
	for (let i=0; i<assignmentListing.length; i++) {
		for (let j=0; j<4; j++) {
			if (typeof assignmentListing[i][j] === 'number')
				progressVal += assignmentListing[i][j];
		}
	}
	
	// accumulate total required points to earn a reinforcer
	// breaking out when it exceeds current progress indicating
	// that it's the next reinforcer to be earned
	let progressNext = 0;
	let reinfIdx = 0;
	for (let i=0; i<reinforcers.length; i++) {
		progressNext += reinforcers[i][1];
		reinfIdx = i;
		if (progressNext > progressVal) {
			break;
		}
	}

	// build string for progress
	let progressStr = `${progressVal} of ${progressNext}`;

	// dynamic assignment to progress meter
	const progressBar=document.getElementById("jgh-progress");
	progressBar.setAttribute("max",progressNext);
	progressBar.setAttribute("value",progressVal);

	// overwrite <div> objects to include strings
	document.getElementById("current-progress").textContent=progressStr;
	document.getElementById("next-target").textContent=reinforcers[reinfIdx][2];
</script>
	</body>
</html>
